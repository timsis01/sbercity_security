name: sbercity-security

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sbercity_security}
      POSTGRES_USER: ${POSTGRES_USER:-sbercity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbercity}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sbercity_security}
      POSTGRES_USER: ${POSTGRES_USER:-sbercity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbercity}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production-please}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DJANGO_MEDIA_ROOT: /app/media
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
      DJANGO_CACHE: database
      NUM_PROXIES: 1
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      target: runtime
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - media:/usr/share/nginx/media:ro
    depends_on:
      backend:
        condition: service_healthy

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-sbercity_security}
      POSTGRES_USER: ${POSTGRES_USER:-sbercity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbercity}
      DJANGO_SECRET_KEY: test-secret-key
      DJANGO_CACHE: database
    depends_on:
      db:
        condition: service_healthy

  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test

volumes:
  pgdata:
  media:
